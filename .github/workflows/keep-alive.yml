# Supabase pauses free projects after 7 days of low activity. This visits the store every
# 3 days (each page load queries the database) so a quiet week doesn't take the shop offline.
# Set the repository variable SITE_URL (Settings → Secrets and variables → Actions → Variables).
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: vars.SITE_URL != ''
    steps:
      - name: Visit the store
        run: |
          for path in / /products; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "${{ vars.SITE_URL }}$path")
            echo "$path → $code"
            [ "$code" = "200" ] || exit 1
          done
