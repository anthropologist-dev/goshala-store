services:
  - type: web
    name: goshala-store
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run setup
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase: { name: goshala-db, property: connectionString }
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        value: https://www.srishivasadgurugoshala.com
databases:
  - name: goshala-db
    region: singapore
    plan: basic-256mb
