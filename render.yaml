# Render Blueprint. Every push to main redeploys and migrates the database.
# One-click: https://render.com/deploy?repo=https://github.com/anthropologist-dev/goshala-store
#
# Database: Supabase (free). Paste Supabase's *session pooler* URI (port 5432) as DATABASE_URL.
# Render's free web plan sleeps after 15 minutes without visitors (about a minute to wake up).
# Change plan to "starter" for an always-on store.
services:
  - type: web
    name: goshala-store
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run db:migrate && npm run db:seed && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        value: https://www.srishivasadgurugoshala.com
